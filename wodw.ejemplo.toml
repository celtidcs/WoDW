[worker]
# Tamaño máximo de un mensaje del Worker al Maestro (48 MiB: cabe un fotograma 4K).
limite_mensaje_ipc_bytes = 50331648
# Tamaño máximo de una orden del Maestro al Worker, que lleva el archivo entero (257 MiB).
limite_orden_ipc_bytes = 269484032
# Resolución máxima de imágenes y vídeos (4K), en cualquier orientación. Se comprueba en la
# cabecera antes de decodificar: lo que la supere se rechaza, no se reduce.
# Si la subes, sube también limite_mensaje_ipc_bytes: tiene que caber un fotograma de esa
# resolución (ancho × alto × 4 bytes) o WoDW no arrancará.
lado_largo_maximo_px = 3840
lado_corto_maximo_px = 2160
# Memoria máxima que puede reservar el decodificador de imágenes.
memoria_maxima_imagen_bytes = 134217728
# Tope de caracteres del texto visible de una página (si se supera, se recorta y se avisa).
max_caracteres_texto = 1000000
# Corte del filtro paso bajo de audio contra balizas ultrasónicas.
frecuencia_corte_audio_hz = 18000
# Pico máximo del audio en milésimas de la escala completa (891 ≈ −1 dBFS).
pico_maximo_audio_por_mil = 891
# Duración aproximada de cada bloque de audio/vídeo que entrega el Worker (ms).
duracion_bloque_ms = 500
# Memoria máxima de cada Worker (2 GiB): si un archivo intenta agotarla, solo muere el Worker.
memoria_maxima_worker_bytes = 2147483648
# Plazo para que un Worker entregue su respuesta.
tiempo_espera_ms = 15000

[actualizaciones]
# Al conectar con Tor, consulta (por Tor) si hay una versión nueva y avisa. Nunca descarga nada.
comprobar_al_iniciar = true
url_api = "https://api.github.com/repos/celtidcs/WoDW/releases/latest"
url_publicaciones = "https://github.com/celtidcs/WoDW/releases/tag/"

[reproduccion]
# Audio que se prepara por adelantado (ms).
bufer_audio_ms = 2000
# Fotogramas de vídeo preparados por adelantado (cada fotograma 4K ocupa ~33 MB).
max_fotogramas_en_bufer = 8
# Volumen inicial en porcentaje (máximo 100: el volumen solo atenúa).
volumen_inicial_por_ciento = 80

[ids]
capacidad_canal = 256
capacidad_difusion = 128
limite_historial = 50
# Contramedidas automáticas: rotación ante amenazas, pánico ante compromiso.
mitigacion_automatica = true
# Cada cuánto se verifican los señuelos.
intervalo_verificacion_ms = 2000

[panico]
# Pulsaciones consecutivas de Esc que disparan el pánico y ventana entre ellas.
pulsaciones = 3
ventana_ms = 1500
# Tras purgar, cerrar la aplicación al instante.
abortar_proceso = true

[canarios]
# Escriben señuelos en disco: desactivados salvo que el directorio esté en RAM.
habilitados = false
# directorio = "/tmp/wodw-canarios"

[interfaz]
ancho_inicial = 1000.0
alto_inicial = 800.0
# Letterboxing: el área de contenido se redondea a múltiplos de estos pasos.
incremento_horizontal = 200.0
incremento_vertical = 100.0
ancho_minimo = 600.0
alto_minimo = 400.0
ancho_maximo = 1400.0
alto_maximo = 1000.0
longitud_titulo_pestana = 20

[automatizacion]
# Bloquear durante la sesión los sitios que provoquen un incidente.
bloquear_hosts_hostiles = true
# Purgar pestañas e historial tras estos minutos sin actividad (0 = nunca).
minutos_inactividad_purga = 30
